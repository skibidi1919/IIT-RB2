[project]
name = "meowler-arm-ui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "protobuf>=4.0",
  "pyserial>=3.5",
]

[project.scripts]
dashboard = "app:main"
serial-log = "serial_pb_log:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meowler_pb"]
py-modules = ["app", "serial_pb_log", "mission", "ota_upload"]
