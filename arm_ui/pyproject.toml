[project]
name = "meowler-arm-ui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "flask-sock>=0.7.0",
  "protobuf>=4.0",
  "pyserial>=3.5",
]

[project.scripts]
dashboard = "app:main"
serial-log = "serial_pb_log:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meowler_pb"]
py-modules = [
  "app",
  "serial_pb_log",
  "ota_upload",
  "rpm_format",
  "color_host",
  "safety",
  "robot_log",
  "mock_robot",
  "hardware_ready",
  "net_discover",
  "ws_hub",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
